    <path d="M200 196C202 176 194 162 178 158" fill="none" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- transform-origin: 120px 206px (settle / breathe from the ground) -->
  <g id="body">
    <path d="M120 66C162 66 196 96 196 126C196 148 184 162 168 168C178 178 178 192 168 200C158 206 140 206 120 206C100 206 82 206 72 200C62 192 62 178 72 168C56 162 44 148 44 126C44 96 78 66 120 66Z" fill="var(--fur)"/>
