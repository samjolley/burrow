  <g id="sparkles">
    <path d="M66 59Q66 68 75 68Q66 68 66 77Q66 68 57 68Q66 68 66 59Z" fill="var(--accent)"/>
    <path d="M176 54Q176 64 186 64Q176 64 176 74Q176 64 166 64Q176 64 176 54Z" fill="var(--accent)"/>
    <path d="M198 109Q198 116 205 116Q198 116 198 123Q198 116 191 116Q198 116 198 109Z" fill="var(--accent-2)"/>
    <path d="M42 111Q42 118 49 118Q42 118 42 125Q42 118 35 118Q42 118 42 111Z" fill="var(--accent-2)"/>
    <path d="M186 144Q186 150 192 150Q186 150 186 156Q186 150 180 150Q186 150 186 144Z" fill="var(--accent)"/>
